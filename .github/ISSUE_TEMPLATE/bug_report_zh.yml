name: 问题报告
description: 报告可以稳定复现的 xhttp-box 问题
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        xhttp-box 是独立维护的非官方衍生项目。请在本仓库报告 xhttp-box
        问题，不要联系 SagerNet 或 sing-box 上游维护者。

  - type: input
    id: version
    attributes:
      label: xhttp-box 版本
      description: 请粘贴 `xhttp-box version` 的完整输出。
      placeholder: xhttp-box version ...
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: 安装方式
      options:
        - GitHub Release 压缩包
        - Alpine APK
        - 容器镜像
        - 从源码构建
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供操作系统、架构以及相关网络拓扑。
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请分别说明预期行为和实际行为。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供尽可能精简、可在本地运行的复现步骤。
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: 配置
      description: 请删除密码、私钥、真实地址及其他敏感信息。
      render: json

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请提供相关 xhttp-box 日志并删除敏感信息。
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我已确认问题来自 xhttp-box，不会向上游项目报告。
          required: true
        - label: 我已删除凭据及其他敏感信息。
          required: true
