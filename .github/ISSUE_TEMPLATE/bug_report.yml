name: Bug report
description: Report a reproducible xhttp-box problem
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        xhttp-box is an independent, unofficial derivative. Report xhttp-box
        problems here, not to SagerNet or the upstream sing-box maintainers.

  - type: input
    id: version
    attributes:
      label: xhttp-box version
      description: Paste the complete output of `xhttp-box version`.
      placeholder: xhttp-box version ...
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - GitHub Release archive
        - Alpine APK
        - Container image
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and relevant network topology.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest local reproduction you can.
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Remove credentials, private keys, addresses, and other secrets.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant xhttp-box logs after removing secrets.
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I confirmed this issue affects xhttp-box and will not report it to the upstream project.
          required: true
        - label: I removed credentials and other sensitive information.
          required: true
