name: Sync Upstream Releases

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional upstream tag (for example v1.14.0-alpha.50); empty selects the latest
        required: false
        type: string
  schedule:
    - cron: '43 4 * * *'
      timezone: Asia/Shanghai

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare upstream sync pull request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev-next
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: dev-next
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Detect latest unsynchronized upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag=$(gh api 'repos/SagerNet/sing-box/releases?per_page=1' \
              --jq '.[0].tag_name // empty')
          fi
          if [[ -z "$tag" || ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid or missing upstream release tag: $tag" >&2
            exit 1
          fi

          tag_ref="refs/tags/upstream/$tag"
          git fetch --force --no-tags \
            https://github.com/SagerNet/sing-box.git \
            "refs/tags/$tag:$tag_ref"
          git rev-parse --verify "$tag_ref" >/dev/null
          upstream_sha=$(git rev-parse "$tag_ref^{}")
          safe_tag=$(printf '%s' "$tag" | tr -c '0-9A-Za-z._-' '-')
          branch="automation/upstream-$safe_tag"

          {
            echo "tag=$tag"
            echo "tag_ref=$tag_ref"
            echo "upstream_sha=$upstream_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=Upstream $tag is already contained in dev-next." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_pr=$(gh pr list \
            --state open \
            --head "$branch" \
            --json url \
            --jq '.[0].url // ""')
          if [[ -n "$existing_pr" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=An upstream sync PR already exists: $existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "reason=Upstream $tag is not yet contained in dev-next." >> "$GITHUB_OUTPUT"

      - name: Report no update
        if: steps.upstream.outputs.needed != 'true'
        env:
          REASON: ${{ steps.upstream.outputs.reason }}
        run: echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream release
        id: merge
        if: steps.upstream.outputs.needed == 'true'
        env:
          BRANCH: ${{ steps.upstream.outputs.branch }}
          TAG_REF: ${{ steps.upstream.outputs.tag_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          base_sha=$(git rev-parse HEAD)
          git switch --create "$BRANCH"

          set +e
          git merge --no-ff --no-edit "$TAG_REF"
          merge_status=$?
          set -e

          # Workflows are maintained independently in xhttp-box. Keeping the
          # base branch versions also lets the built-in GITHUB_TOKEN push the
          # synchronization branch without Workflow write permission.
          git rm -r -f --ignore-unmatch .github/workflows
          git restore \
            --source="$base_sha" \
            --staged \
            --worktree \
            -- .github/workflows

          if (( merge_status == 0 )); then
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            git commit --no-edit
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflicts=true" >> "$GITHUB_OUTPUT"

      - name: Test clean merge before using Aider
        id: precheck
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          steps.merge.outputs.conflicts != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          .github/check-branding.sh
          go test -count=1 ./transport/v2rayxhttp
          go test -race -count=1 ./transport/v2rayxhttp
          go test -count=1 -tags with_quic ./transport/v2rayxhttp
          go test -count=1 -tags with_utls ./transport/v2rayxhttp
          go build -trimpath \
            -o "$RUNNER_TEMP/xhttp-box-upstream-check" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "$(cat release/LDFLAGS)" \
            ./cmd/sing-box

      - name: Setup Python for Aider
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        run: pip install aider-chat

      - name: Ask Aider to resolve conflicts or compatibility failures
        id: aider
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        env:
          AIDER_OPENAI_API_BASE: ${{
            secrets.OPENAI_API_BASE ||
            'https://openrouter.ai/api/v1' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIDER_MODEL: ${{
            secrets.AIDER_MODEL ||
            'openrouter/free' }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          AIDER_MESSAGE: >-
            Adapt xhttp-box to the in-progress merge of SagerNet/sing-box
            release ${{ steps.upstream.outputs.tag }}. Resolve every Git
            conflict and fix any XHTTP test or build failures. Preserve the
            independent xhttp-box README, release automation, and all
            project-specific XHTTP implementation, protocol options, Xray
            interoperability, REALITY/uTLS, HTTP/3, lifecycle, and XMUX tests.
            Prefer upstream changes outside project-specific XHTTP code. Make
            the smallest necessary compatibility changes. Do not abort the
            merge, create commits, push, open pull requests, or modify
            unrelated behavior. Leave all resolved changes in the working tree
            and run focused tests when useful.
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "Missing OpenRouter API key. Set the OPENAI_API_KEY secret." >&2
            exit 1
          fi
          # Batch conflicts into small groups so the prompt stays under the
          # free OpenRouter router's 200k context window. Aider resolves each
          # batch; the loop stops when no conflict count improves.
          batch_size=5
          iterations=0
          while :; do
            mapfile -t conflicted_files < <(git diff --name-only --diff-filter=U || true)
            if (( ${#conflicted_files[@]} == 0 )); then
              break
            fi
            batch=("${conflicted_files[@]:0:$batch_size}")
            echo "Aider iteration $((iterations + 1)): ${batch[*]}" >> "$GITHUB_STEP_SUMMARY"
            aider \
              --yes-always \
              --no-git \
              --no-repo-map \
              --no-auto-commits \
              --no-attribute-commit-message-author \
              --no-attribute-commit-message-committer \
              --message "$AIDER_MESSAGE" \
              "${batch[@]}"
            # Aider runs with --no-git and only edits the working tree; stage
            # the batch so resolved conflicts leave the unmerged set.
            git add "${batch[@]}" || true
            iterations=$((iterations + 1))
            mapfile -t remaining < <(git diff --name-only --diff-filter=U || true)
            if (( ${#remaining[@]} == 0 )); then
              break
            fi
            # Stop if Aider made no progress or hit the safety cap.
            if [[ "${remaining[*]}" == "${conflicted_files[*]}" ]] || (( iterations >= 10 )); then
              break
            fi
          done
          mapfile -t remaining < <(git diff --name-only --diff-filter=U || true)
          if (( ${#remaining[@]} != 0 )); then
            echo "Aider could not resolve:" >&2
            printf '%s\n' "${remaining[@]}" >&2
            exit 1
          fi

      - name: Commit Aider adaptation
        if: steps.aider.outcome == 'success'
        env:
          BASE_SHA: ${{ github.sha }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          git rm -r -f --ignore-unmatch .github/workflows
          git restore \
            --source="$BASE_SHA" \
            --staged \
            --worktree \
            -- .github/workflows

          unmerged=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unmerged" ]]; then
            echo "Aider left unresolved conflicts:" >&2
            echo "$unmerged" >&2
            exit 1
          fi

          git add --all
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
            git commit -m "merge: sync upstream $UPSTREAM_TAG"
          elif ! git diff --cached --quiet; then
            git commit -m "fix(xhttp): adapt to upstream $UPSTREAM_TAG"
          fi

      - name: Validate Aider adaptation
        if: steps.aider.outcome == 'success'
        run: |
          set -euo pipefail
          .github/check-branding.sh
          go test -count=1 ./transport/v2rayxhttp
          go test -race -count=1 ./transport/v2rayxhttp
          go test -count=1 -tags with_quic ./transport/v2rayxhttp
          go test -count=1 -tags with_utls ./transport/v2rayxhttp
          go build -trimpath \
            -o "$RUNNER_TEMP/xhttp-box-upstream-check" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "$(cat release/LDFLAGS)" \
            ./cmd/sing-box

      - name: Push branch and create draft pull request
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          AIDER_USED: ${{ steps.aider.outcome == 'success' }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "${GITHUB_SHA}..HEAD" -- .github/workflows; then
            echo "The synchronization branch contains forbidden workflow changes." >&2
            git diff --stat "${GITHUB_SHA}..HEAD" -- .github/workflows >&2
            exit 1
          fi
          git push --set-upstream origin "HEAD:$BRANCH"

          pr_url=$(gh pr create \
            --draft \
            --base dev-next \
            --head "$BRANCH" \
            --title "chore: sync upstream $UPSTREAM_TAG" \
            --body-file - <<EOF
          ## Upstream release

          - Repository: \`SagerNet/sing-box\`
          - Tag: \`$UPSTREAM_TAG\`
          - Commit: \`$UPSTREAM_SHA\`
          - Aider adaptation used: \`$AIDER_USED\`

          ## Validation

          - XHTTP transport tests
          - XHTTP race tests
          - HTTP/3 build-tag tests
          - uTLS build-tag tests
          - Full command-line binary build

          This pull request was generated by the scheduled upstream release
          synchronization workflow and intentionally remains a draft for
          maintainer review.
          EOF
          )
          echo "Created $pr_url" >> "$GITHUB_STEP_SUMMARY"
