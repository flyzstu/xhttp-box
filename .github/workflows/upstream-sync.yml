name: Sync Upstream Releases

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional upstream tag (for example v1.14.0-alpha.50); empty selects the latest
        required: false
        type: string
      copilot_smoke_test:
        description: Only verify that GITHUB_TOKEN can make a Copilot request
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '43 4 * * *'
      timezone: Asia/Shanghai

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  copilot-smoke-test:
    name: Verify Copilot authentication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.copilot_smoke_test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Make a minimal Copilot request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(copilot -s --no-ask-user -p 'Reply with exactly COPILOT_OK and nothing else.')
          if [[ "$response" != "COPILOT_OK" ]]; then
            echo "Unexpected Copilot response: $response" >&2
            exit 1
          fi
          echo "Copilot accepted the workflow GITHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Prepare upstream sync pull request
    if: ${{ !inputs.copilot_smoke_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    steps:
      - name: Checkout dev-next
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: dev-next
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: true

      - name: Detect latest unsynchronized upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag=$(gh api 'repos/SagerNet/sing-box/releases?per_page=1' \
              --jq '.[0].tag_name // empty')
          fi
          if [[ -z "$tag" || ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid or missing upstream release tag: $tag" >&2
            exit 1
          fi

          tag_ref="refs/tags/upstream/$tag"
          git fetch --force --no-tags \
            https://github.com/SagerNet/sing-box.git \
            "refs/tags/$tag:$tag_ref"
          git rev-parse --verify "$tag_ref" >/dev/null
          upstream_sha=$(git rev-parse "$tag_ref^{}")
          safe_tag=$(printf '%s' "$tag" | tr -c '0-9A-Za-z._-' '-')
          branch="automation/upstream-$safe_tag"

          {
            echo "tag=$tag"
            echo "tag_ref=$tag_ref"
            echo "upstream_sha=$upstream_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=Upstream $tag is already contained in dev-next." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_pr=$(gh pr list \
            --state open \
            --head "$branch" \
            --json url \
            --jq '.[0].url // ""')
          if [[ -n "$existing_pr" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=An upstream sync PR already exists: $existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "reason=Upstream $tag is not yet contained in dev-next." >> "$GITHUB_OUTPUT"

      - name: Report no update
        if: steps.upstream.outputs.needed != 'true'
        env:
          REASON: ${{ steps.upstream.outputs.reason }}
        run: echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream release
        id: merge
        if: steps.upstream.outputs.needed == 'true'
        env:
          BRANCH: ${{ steps.upstream.outputs.branch }}
          TAG_REF: ${{ steps.upstream.outputs.tag_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          base_sha=$(git rev-parse HEAD)
          git switch --create "$BRANCH"

          set +e
          git merge --no-ff --no-edit "$TAG_REF"
          merge_status=$?
          set -e

          # Workflows are maintained independently in xhttp-box. Keeping the
          # base branch versions also lets the built-in GITHUB_TOKEN push the
          # synchronization branch without Workflow write permission.
          git rm -r -f --ignore-unmatch .github/workflows
          git restore \
            --source="$base_sha" \
            --staged \
            --worktree \
            -- .github/workflows

          if (( merge_status == 0 )); then
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            git commit --no-edit
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflicts=true" >> "$GITHUB_OUTPUT"

      - name: Test clean merge before using Copilot
        id: precheck
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          steps.merge.outputs.conflicts != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          go test -count=1 ./transport/v2rayxhttp
          go test -race -count=1 ./transport/v2rayxhttp
          go test -count=1 -tags with_quic ./transport/v2rayxhttp
          go test -count=1 -tags with_utls ./transport/v2rayxhttp
          go build -trimpath \
            -o "$RUNNER_TEMP/xhttp-box-upstream-check" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "$(cat release/LDFLAGS)" \
            ./cmd/sing-box

      - name: Setup Node.js for Copilot
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Copilot CLI
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        run: npm install --global @github/copilot

      - name: Ask Copilot to resolve conflicts or compatibility failures
        id: copilot
        if: >-
          steps.upstream.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicts == 'true' ||
          steps.precheck.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          copilot -p "
          Adapt xhttp-box to the in-progress merge of SagerNet/sing-box
          release ${UPSTREAM_TAG}.

          Resolve every Git conflict and fix any XHTTP test or build failures.
          Preserve the independent xhttp-box README, release automation, and
          all project-specific XHTTP implementation, protocol options, Xray
          interoperability, REALITY/uTLS, HTTP/3, lifecycle, and XMUX tests.
          Prefer upstream changes outside project-specific XHTTP code. Make
          the smallest necessary compatibility changes. Do not abort the
          merge, create commits, push, open pull requests, or modify unrelated
          behavior. Leave all resolved changes in the working tree and run
          focused tests when useful.
          " \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(go:*)' \
            --allow-tool='shell(gofmt:*)' \
            --allow-tool='shell(rg:*)' \
            --allow-tool=write \
            --no-ask-user

      - name: Commit Copilot adaptation
        if: steps.copilot.outcome == 'success'
        env:
          BASE_SHA: ${{ github.sha }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          git rm -r -f --ignore-unmatch .github/workflows
          git restore \
            --source="$BASE_SHA" \
            --staged \
            --worktree \
            -- .github/workflows

          unmerged=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unmerged" ]]; then
            echo "Copilot left unresolved conflicts:" >&2
            echo "$unmerged" >&2
            exit 1
          fi

          git add --all
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
            git commit -m "merge: sync upstream $UPSTREAM_TAG"
          elif ! git diff --cached --quiet; then
            git commit -m "fix(xhttp): adapt to upstream $UPSTREAM_TAG"
          fi

      - name: Validate Copilot adaptation
        if: steps.copilot.outcome == 'success'
        run: |
          set -euo pipefail
          go test -count=1 ./transport/v2rayxhttp
          go test -race -count=1 ./transport/v2rayxhttp
          go test -count=1 -tags with_quic ./transport/v2rayxhttp
          go test -count=1 -tags with_utls ./transport/v2rayxhttp
          go build -trimpath \
            -o "$RUNNER_TEMP/xhttp-box-upstream-check" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "$(cat release/LDFLAGS)" \
            ./cmd/sing-box

      - name: Push branch and create draft pull request
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          COPILOT_USED: ${{ steps.copilot.outcome == 'success' }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "${GITHUB_SHA}..HEAD" -- .github/workflows; then
            echo "The synchronization branch contains forbidden workflow changes." >&2
            git diff --stat "${GITHUB_SHA}..HEAD" -- .github/workflows >&2
            exit 1
          fi
          git push --set-upstream origin "HEAD:$BRANCH"

          pr_url=$(gh pr create \
            --draft \
            --base dev-next \
            --head "$BRANCH" \
            --title "chore: sync upstream $UPSTREAM_TAG" \
            --body-file - <<EOF
          ## Upstream release

          - Repository: \`SagerNet/sing-box\`
          - Tag: \`$UPSTREAM_TAG\`
          - Commit: \`$UPSTREAM_SHA\`
          - Copilot adaptation used: \`$COPILOT_USED\`

          ## Validation

          - XHTTP transport tests
          - XHTTP race tests
          - HTTP/3 build-tag tests
          - uTLS build-tag tests
          - Full command-line binary build

          This pull request was generated by the scheduled upstream release
          synchronization workflow and intentionally remains a draft for
          maintainer review.
          EOF
          )
          echo "Created $pr_url" >> "$GITHUB_STEP_SUMMARY"
