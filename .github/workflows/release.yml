name: Publish Versioned Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix (for example 0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: versioned-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Checkout dev-next
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: dev-next
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must look like 0.2.0 or 0.2.0-rc.1: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_title=xhttp-box v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          for tag in "$RELEASE_TAG" "$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists." >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists." >&2
              exit 1
            fi
          done

      - name: Record release target
        id: target
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run XHTTP release tests
        run: |
          set -euo pipefail
          go test -count=1 ./transport/v2rayxhttp
          go test -race -count=1 ./transport/v2rayxhttp
          go test -count=1 -tags with_quic ./transport/v2rayxhttp
          go test -count=1 -tags with_utls ./transport/v2rayxhttp

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, extension: tar.gz }
          - { os: android, arch: arm64, extension: tar.gz }
          - { os: windows, arch: amd64, extension: zip }
    steps:
      - name: Checkout release target
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath \
            -o "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $(cat release/LDFLAGS) -s -w -buildid=" \
            ./cmd/sing-box

      - name: Install apk-tools
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:edge \
            sh -c 'apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk'

      - name: Package Alpine APK
        if: matrix.os == 'linux'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          .github/build_alpine_apk.sh \
            x86_64 \
            "$VERSION" \
            dist/xhttp-box \
            "dist/xhttp-box-$VERSION-linux-x86_64.apk"

      - name: Archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          name="xhttp-box-$VERSION-$TARGET_OS-$TARGET_ARCH"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          cp NOTICE.md "dist/$name/"
          cp "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}" "dist/$name/"
          if [[ "$EXTENSION" == "zip" ]]; then
            (cd dist && zip -qr "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name" "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Validate release asset names
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            if [[ "$name" != *"$VERSION"* ]]; then
              echo "Release asset does not include version $VERSION: $name" >&2
              exit 1
            fi
            if [[ "$name" == *sing-box* ]]; then
              echo "Release asset uses upstream project name: $name" >&2
              exit 1
            fi
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          checksum_file=$(mktemp)
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$checksum_file"
          mv "$checksum_file" dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.release_title }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            "${release_flags[@]}"

          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Publish container image
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release target
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
