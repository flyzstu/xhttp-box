name: Publish Development Builds

on:
  push:
    branches:
      - dev-next
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, extension: tar.gz }
          - { os: windows, arch: amd64, extension: zip }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Set version
        id: version
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.version.outputs.version }}' $(cat release/LDFLAGS) -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
      - name: Install apk-tools
        if: matrix.os == 'linux'
        run: |
          set -xeuo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:edge \
            sh -c 'apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk'
      - name: Package Alpine APK
        if: matrix.os == 'linux'
        run: |
          set -xeuo pipefail
          apk_version="0.0.0_p$((16#${GITHUB_SHA::7}))"
          .github/build_alpine_apk.sh \
            x86_64 \
            "$apk_version" \
            "dist/xhttp-box" \
            "dist/xhttp-box-${{ steps.version.outputs.version }}-linux-x86_64.apk"
      - name: Archive
        run: |
          set -xeuo pipefail
          name="xhttp-box-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          cp NOTICE.md "dist/$name/"
          cp "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}" "dist/$name/"
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            (cd dist && zip -qr "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name" "dist/xhttp-box${{ matrix.os == 'windows' && '.exe' || '' }}"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: xhttp-box-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set release metadata
        id: metadata
        run: |
          version=${GITHUB_SHA::7}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dev-$version" >> "$GITHUB_OUTPUT"
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -xeuo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Development build $VERSION" \
              --prerelease \
              --generate-notes
          fi
